[package]
name = "yater"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Rene Zhou"]
description = "A terminal-native EPUB reader with CJK-friendly sentence navigation, inline images, TOC navigation, and footnote overlays."
license = "MIT"
repository = "https://github.com/Rene-Zhou/YATER"
readme = "README.md"
keywords = ["epub", "terminal", "tui", "reader", "cjk"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-image = { version = "11.0.3", default-features = false, features = ["crossterm"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
